<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#02040a">
<title>Time Weather Canvas</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --cyan: #63f3ff;
    --blue: #4f8cff;
    --purple: #a66cff;
    --green: #62ffb0;
    --yellow: #ffe66d;
    --red: #ff5c7c;
    --white: #edfaff;
    --background: #02040a;
}

html, body { width: 100%; height: 100%; overflow: hidden; }

body {
    font-family: Inter, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--white);
    background:
        radial-gradient(circle at 50% 42%, rgba(55, 110, 255, 0.13), transparent 32%),
        radial-gradient(circle at 20% 80%, rgba(0, 255, 255, 0.06), transparent 30%),
        radial-gradient(circle at 85% 15%, rgba(160, 80, 255, 0.08), transparent 28%),
        var(--background);
}

#weatherCanvas,
.grid,
.scanlines,
.vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

#weatherCanvas { width: 100%; height: 100%; z-index: 0; }

.grid {
    z-index: 1;
    background-image:
        linear-gradient(rgba(99, 243, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99, 243, 255, 0.035) 1px, transparent 1px);
    background-size: 70px 70px;
    mask-image: radial-gradient(ellipse at center, black 0%, transparent 78%);
}

.scanlines {
    z-index: 20;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.018) 0px,
        rgba(255, 255, 255, 0.018) 1px,
        transparent 2px,
        transparent 5px
    );
    opacity: 0.18;
}

.vignette {
    z-index: 19;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.6) 100%);
}

.cursor-light {
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(70, 210, 255, 0.08), transparent 68%);
    filter: blur(5px);
}

.app {
    position: relative;
    z-index: 5;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    overflow: hidden;
}

.glow {
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(70, 180, 255, 0.055), transparent 70%);
    filter: blur(20px);
    animation: breathing 5s ease-in-out infinite;
}

@keyframes breathing {
    0%, 100% { opacity: 0.5; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.15); }
}

.header {
    position: absolute;
    top: 34px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    letter-spacing: 0.35em;
    opacity: 0.8;
    white-space: nowrap;
}

.header-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--cyan);
    text-shadow: 0 0 10px rgba(99, 243, 255, 0.8), 0 0 30px rgba(99, 243, 255, 0.3);
}

.header-subtitle {
    margin-top: 7px;
    font-size: 9px;
    color: rgba(230, 250, 255, 0.45);
    letter-spacing: 0.28em;
}

.clock-wrapper {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: -20px;
}

.clock-ring {
    display: none;
    position: absolute;
    width: min(78vw, 780px);
    height: min(78vw, 780px);
    border-radius: 50%;
    border: 1px solid rgba(99, 243, 255, 0.12);
    box-shadow: 0 0 40px rgba(80, 180, 255, 0.05), inset 0 0 80px rgba(80, 180, 255, 0.03);
    animation: rotateSlow 50s linear infinite;
}

.clock-ring::before {
    content: "";
    position: absolute;
    inset: 7%;
    border-radius: 50%;
    border: 1px dashed rgba(166, 108, 255, 0.1);
    animation: rotateSlowReverse 80s linear infinite;
}

.clock-ring::after {
    content: "";
    position: absolute;
    width: 9px;
    height: 9px;
    top: 9%;
    left: 50%;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan), 0 0 30px var(--cyan), 0 0 70px rgba(99, 243, 255, 0.7);
}

@keyframes rotateSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes rotateSlowReverse { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }


.timezone-label {
    margin-bottom: 18px;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: rgba(220, 250, 255, 0.55);
    text-align: center;
}

.clock-label {
    font-size: 10px;
    color: rgba(220, 250, 255, 0.45);
    letter-spacing: 0.45em;
    margin-bottom: 16px;
}

.time {
    position: relative;
    font-size: clamp(70px, 12vw, 190px);
    font-weight: 300;
    line-height: 0.9;
    letter-spacing: -0.055em;
    white-space: nowrap;
    color: #effcff;
    text-shadow:
        0 0 5px rgba(255, 255, 255, 0.8),
        0 0 20px rgba(99, 243, 255, 0.65),
        0 0 60px rgba(80, 160, 255, 0.35),
        0 0 120px rgba(80, 160, 255, 0.15);
    font-variant-numeric: tabular-nums;
}

.time::after {
    content: "";
    position: absolute;
    left: 10%;
    right: 10%;
    bottom: -16px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity: 0.45;
    box-shadow: 0 0 15px var(--cyan);
}

.date {
    margin-top: 28px;
    font-size: 12px;
    letter-spacing: 0.28em;
    color: rgba(220, 250, 255, 0.65);
}

.weather-panel {
    margin-top: 24px;
    width: min(900px, 92vw);
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: weatherAppear 1.2s ease;
}

@keyframes weatherAppear {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

.weather-main {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
}

.weather-icon {
    width: 72px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 58px;
    filter: drop-shadow(0 0 15px rgba(99, 243, 255, 0.5));
    animation: weatherFloat 4s ease-in-out infinite;
}

@keyframes weatherFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

.weather-temperature {
    font-size: 42px;
    font-weight: 300;
    letter-spacing: -0.04em;
    text-shadow: 0 0 25px rgba(99, 243, 255, 0.25);
}

.weather-condition {
    margin-left: 2px;
    font-size: 12px;
    color: rgba(235, 250, 255, 0.62);
    letter-spacing: 0.12em;
}

.weather-location {
    margin-top: 6px;
    font-size: 10px;
    color: rgba(235, 250, 255, 0.35);
    letter-spacing: 0.28em;
}

.weather-stats {
    display: flex;
    gap: 28px;
    margin-top: 20px;
    flex-wrap: wrap;
    justify-content: center;
}

.stat { min-width: 75px; text-align: center; }

.stat-value {
    font-size: 12px;
    color: rgba(240, 253, 255, 0.85);
    font-variant-numeric: tabular-nums;
}

.stat-label {
    margin-top: 4px;
    font-size: 8px;
    letter-spacing: 0.15em;
    color: rgba(230, 250, 255, 0.3);
}

.forecast {
    width: 100%;
    margin-top: 12px;
    display: flex;
    justify-content: center;
    gap: 4px;
}

.forecast-item {
    width: 70px;
    padding: 8px 5px;
    border-top: 1px solid rgba(99, 243, 255, 0.1);
    text-align: center;
    transition: background 0.3s, transform 0.3s;
}

.forecast-item:hover {
    background: rgba(99, 243, 255, 0.035);
    transform: translateY(-3px);
}

.forecast-time {
    font-size: 8px;
    color: rgba(230, 250, 255, 0.3);
    letter-spacing: 0.05em;
}

.forecast-icon { margin-top: 5px; font-size: 17px; }

.forecast-temp {
    margin-top: 3px;
    font-size: 10px;
    color: rgba(240, 253, 255, 0.7);
    font-variant-numeric: tabular-nums;
}

.status-panel,
.weather-status {
    position: absolute;
    bottom: 18px;
    font-family: "SFMono-Regular", Consolas, monospace;
    letter-spacing: 0.08em;
}

.status-panel {
    left: 30px;
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 9px;
    color: rgba(220, 250, 255, 0.38);
}

.status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--yellow);
    box-shadow: 0 0 10px var(--yellow);
    transition: background 0.4s, box-shadow 0.4s;
}

.status-dot.calibrated {
    background: var(--green);
    box-shadow: 0 0 10px var(--green), 0 0 20px rgba(98, 255, 176, 0.5);
}

.status-dot.offline {
    background: var(--red);
    box-shadow: 0 0 10px var(--red);
}

.status-text { display: flex; flex-direction: column; gap: 3px; }

.weather-status {
    right: 30px;
    font-size: 8px;
    color: rgba(220, 250, 255, 0.25);
    text-align: right;
}

@media (max-width: 700px) {
    .app { padding: 20px; }
    .clock-wrapper { margin-top: -30px; }
    .clock-ring { width: 95vw; height: 95vw; }
    .weather-panel { margin-top: 35px; }
    .weather-main { gap: 10px; }
    .weather-icon { font-size: 45px; width: 55px; }
    .weather-temperature { font-size: 32px; }
    .weather-stats { gap: 15px; }
    .forecast { overflow-x: auto; justify-content: flex-start; padding-bottom: 4px; }
    .forecast-item { min-width: 60px; }
    .status-panel { left: 15px; bottom: 14px; }
    .weather-status { right: 15px; bottom: 14px; }
}

@media (max-height: 750px) {
    .clock-wrapper { margin-top: -20px; }
    .weather-panel { margin-top: 25px; }
    .forecast { margin-top: 15px; }
    .header { top: 18px; }
}
</style>
</head>

    <section class="weather-panel">

                <div class="weather-location" id="weatherLocation">LOCATING...</div>
            </div>
        </div>

        <div class="weather-stats">
            <div class="stat">
                <div class="stat-value" id="feelsLike">--°</div>
                <div class="stat-label">FEELS LIKE</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="humidity">--%</div>
                <div class="stat-label">HUMIDITY</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="wind">-- km/h</div>
                <div class="stat-label">WIND</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="precipitation">--%</div>
                <div class="stat-label">RAIN CHANCE</div>
            </div>
        </div>

        <div class="forecast" id="forecast"></div>
    </section>

    <div class="status-panel">
        <div class="status-dot" id="statusDot"></div>
        <div class="status-text">
            <div id="syncStatus">INITIALIZING</div>
            <div id="syncDetail">CONNECTING...</div>
        </div>
    </div>

    <div class="weather-status">
        <div id="weatherStatus">WEATHER · CONNECTING</div>
        <div id="weatherUpdated">--</div>
    </div>
</div>

function normalizeLocale(locale) {
    const exact = LANGUAGE_ALIASES[locale];
    if (exact && I18N[exact]) return exact;
    const base = String(locale || "en").split("-")[0].toLowerCase();
    if (I18N[base]) return base;
    return "en";
}

function localeBase(locale = selectedLocale) {
    return String(locale).split("-")[0].toLowerCase();
}

function localeForCountry(countryCode) {
    const code = String(countryCode || "").toUpperCase();
    const mapped = COUNTRY_LOCALES[code];
    if (mapped) return normalizeLocale(mapped);
    return normalizeLocale(navigator.language || "en-US");
}

function pad2(n) {
    return String(n).padStart(2, "0");
}

function offsetSecondsFor(timeZone, date = new Date()) {
    const name = new Intl.DateTimeFormat("en-US", {
        timeZone,
        timeZoneName: "longOffset"
    }).formatToParts(date).find(part => part.type === "timeZoneName")?.value || "";
    const match = name.match(/([+-])(\d{1,2})(?::?(\d{2}))?/);
    if (!match) return 0;
    return (match[1] === "-" ? -1 : 1) * (Number(match[2]) * 3600 + Number(match[3] || 0) * 60);
}

function formatUtcOffset(seconds) {
    const sign = seconds >= 0 ? "+" : "-";
    const abs = Math.abs(seconds);
    return `UTC${sign}${pad2(Math.floor(abs / 3600))}:${pad2(Math.floor((abs % 3600) / 60))}`;
}

function offsetString(seconds) {
    const sign = seconds >= 0 ? "+" : "-";
    const abs = Math.abs(seconds);
    return `${sign}${pad2(Math.floor(abs / 3600))}:${pad2(Math.floor((abs % 3600) / 60))}`;
}

function withLocalOffset(value) {
    if (OFFSET_RE.test(value)) return value;
    const seconds = place.utcOffsetSeconds ?? offsetSecondsFor(place.timezone);
    return value + offsetString(seconds);
}

function setTimezone(timeZone) {
    if (!timeZone) return;
    place.timezone = timeZone;
    place.utcOffsetSeconds = offsetSecondsFor(timeZone);
    updateFormatters();
}

function corePlaceName(name) {
    return (name || "")
        .replace(/(特别行政区|维吾尔自治区|壮族自治区|回族自治区|自治区|省|市|区|县|旗)$/g, "")
        .replace(/(市|区|县)$/g, "");
}

function uniqueNames(...names) {
    const seen = new Set();
    return names.filter(Boolean).filter(name => {
        const key = corePlaceName(name);
        if (seen.has(name) || (key && seen.has(key))) return false;
        seen.add(name);
        if (key) seen.add(key);
        return true;
    });
}

function displayCityName(name) {
    if (!name) return ui.unknownLocation;
    const clean = name.replace(/市$/, "");
    const base = localeBase();
    if (["zh", "ja", "ko", "th", "ar", "hi"].includes(base)) return clean;
    try {
        return clean.toLocaleUpperCase(ui.htmlLang);
    } catch {
        return clean.toUpperCase();
    }
}

function updatePlaceLabels() {
    const district = place.district;
    const city = (place.city || "").replace(/市$/, "");
    const country = place.country;
    const placeLine = district && city && corePlaceName(district) !== corePlaceName(city)
        ? `${district} · ${city}`
        : (uniqueNames(district || city, country).join(" · ") || ui.unknownLocation);
    const cityName = displayCityName(place.district || city || "");

    weatherLocation.textContent = placeLine;
    clockLabel.textContent = ui.timeTitle(place.district || city || ui.unknownLocation);
    headerTitle.textContent = ui.standardTitle(place.city || place.district || ui.unknownLocation);
    headerSubtitle.textContent =
        `${place.timezone.replace(/_/g, " ").replace(/\//g, " / ")} · ${formatUtcOffset(place.utcOffsetSeconds ?? offsetSecondsFor(place.timezone))}`;
    document.title = `${place.city || place.district || ui.unknownLocation} · ${ui.localTime}`;
}

function timeSources() {
    const tz = place.timezone;
    return [
        {
            name: "TIMEAPI",
            url: `https://timeapi.io/api/Time/current/zone?timeZone=${encodeURIComponent(tz)}`,
            parser(data) {
                if (!data.dateTime) throw new Error("TimeAPI: missing dateTime");
                const timestamp = new Date(withLocalOffset(data.dateTime)).getTime();
                if (!Number.isFinite(timestamp)) throw new Error("TimeAPI: invalid timestamp");
                return timestamp;
            }
        },
        {
            name: "WORLDTIMEAPI",
            url: `https://worldtimeapi.org/api/timezone/${tz}`,
            parser(data) {
                if (typeof data.unixtime !== "number") throw new Error("WorldTimeAPI: missing unixtime");
                return data.unixtime * 1000;
            }
        }
    ];
}

async function fetchJson(url) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    try {
        const response = await fetch(url, { cache: "no-store", signal: controller.signal });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
    } finally {
        clearTimeout(timeout);
    }
}

function parseBigDataCloud(data) {
    const city = data.city || data.locality || data.principalSubdivision || "";
    const locality = data.locality || "";
    const district = locality && corePlaceName(locality) !== corePlaceName(city) ? locality : "";

    return {
        district,
        city,
        country: data.countryName || "",
        countryCode: data.countryCode || ""
    };
}

function parseNominatim(data) {
    const address = data.address || {};
    return {
        district: address.suburb || address.city_district || address.district || address.county || "",
        city: address.city || address.town || address.village || address.state || "",
        country: address.country || "",
        countryCode: address.country_code?.toUpperCase() || ""
    };
}

function applyPlaceNames({ district = "", city = "", country = "", countryCode = "", timezone = "" }) {
    place.district = district;
    place.city = city;
    place.country = country;
    place.countryCode = countryCode;
    if (timezone) setTimezone(timezone);
    if (countryCode) setInterfaceLocale(localeForCountry(countryCode));
    updatePlaceLabels();
}

async function reverseGeocode(latitude, longitude) {
    try {
        const data = await fetchJson(
            `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=default`
        );
        return parseBigDataCloud(data);
    } catch (error) {
        console.warn("BigDataCloud reverse geocode failed:", error);
        const language = ui.htmlLang || "en";
        const data = await fetchJson(
            `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latitude}&lon=${longitude}&zoom=14&addressdetails=1&accept-language=${encodeURIComponent(language)}`
        );
        return parseNominatim(data);
    }
}

async function getIpPosition() {
    const data = await fetchJson("https://ipwho.is/");
    if (!data.success || data.latitude == null || data.longitude == null) {
        throw new Error("IP location unavailable");
    }

    applyPlaceNames({
        city: data.city || "",
        country: data.country || "",
        countryCode: data.country_code || "",
        timezone: data.timezone?.id || ""
    });

    return { latitude: data.latitude, longitude: data.longitude };
}

async function resolveLocation() {
    weatherStatus.textContent = ui.locationEstimating;

    // No navigator.geolocation call: no browser location permission dialog.
    const coords = await getIpPosition();
    place.latitude = coords.latitude;
    place.longitude = coords.longitude;

    try {
        applyPlaceNames(await reverseGeocode(coords.latitude, coords.longitude));
    } catch (error) {
        console.warn("Reverse geocode failed:", error);
        updatePlaceLabels();
    }
}

async function fetchTimeSource(source) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    const start = performance.now();

    try {
        const response = await fetch(source.url, { method: "GET", cache: "no-store", signal: controller.signal });
        const end = performance.now();
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const rtt = end - start;
        const serverTimestamp = source.parser(await response.json());
        return { source: source.name, serverTimestamp, estimatedServerNow: serverTimestamp + rtt / 2, rtt };
    } finally {
        clearTimeout(timeout);
    }
}

async function synchronizeClock() {
    setSyncUI("status-dot", ui.calibrating, ui.contacting);

    for (const source of timeSources()) {
        try {
            const result = await fetchTimeSource(source);
            syncServerTime = result.estimatedServerNow;
            syncPerformanceTime = performance.now();
            clockOffset = result.estimatedServerNow - Date.now();
            calibrated = true;
            lastSyncTimestamp = Date.now();
            currentTimeSource = result.source;
            lastRTT = result.rtt;
            setSyncUI(
                "status-dot calibrated",
                ui.calibratedOnline,
                `${result.source} · RTT ${Math.round(result.rtt)}ms`
            );
            return true;
        } catch (error) {
            console.warn(`${source.name} failed:`, error);
        }
    }

    if (calibrated) {
        setSyncUI("status-dot offline", ui.offlineHoldover, ui.lastCalibration);
    } else {
        setSyncUI("status-dot offline", ui.localClock, ui.calibrationFailed);
    }
    return false;
}

function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function createParticles(mode) {
    const count = PARTICLE_COUNTS[mode] ?? 70;
    const result = [];
    for (let i = 0; i < count; i++) {
        result.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            speed: 0.3 + Math.random() * 1.5,
            size: 0.5 + Math.random() * 2,
            drift: (Math.random() - 0.5) * 0.4,
            opacity: 0.15 + Math.random() * 0.35,
            phase: Math.random() * Math.PI * 2
        });
    }
    return result;
}

function setWeatherMode(newMode) {
    if (newMode === currentWeatherMode && !transitionActive) return;
    previousWeatherMode = currentWeatherMode;
    nextParticles = createParticles(newMode);
    currentWeatherMode = newMode;
    transitionStart = performance.now();
    transitionActive = true;
}

function wrapParticle(p, mode) {
    const w = window.innerWidth;
    const h = window.innerHeight;

    if (mode === "clear" || mode === "cloud") {
        p.y -= p.speed * 0.15;
        p.x += p.drift + Math.sin(performance.now() * 0.0004 + p.phase) * 0.08;
        if (p.y < -10) p.y = h + 10;
        return;
    }

    if (mode === "rain" || mode === "storm") {
        p.y += p.speed * 7;
        p.x += p.drift;
        if (p.y > h + 20) {
            p.y = -20;
            p.x = Math.random() * w;
        }
        return;
    }

    if (mode === "snow") {
        p.y += p.speed;
        p.x += Math.sin(p.y * 0.01 + p.phase) * 0.3;
        if (p.y > h + 10) p.y = -10;
        return;
    }

    if (mode === "fog") {
        p.x += p.speed * 0.25;
        if (p.x > w + 100) p.x = -100;
    }
}

function updateParticles(particleList, mode) {
    for (const p of particleList) wrapParticle(p, mode);
}

function drawParticles(particleList, mode, alpha) {
    if (alpha <= 0) return;

    for (const p of particleList) {
        ctx.beginPath();
        if (mode === "clear" || mode === "cloud") {
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(110, 220, 255, ${p.opacity * alpha})`;
            ctx.fill();
        } else if (mode === "rain" || mode === "storm") {
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x - 2, p.y + 14);
            ctx.strokeStyle = `rgba(100, 210, 255, ${p.opacity * alpha * 0.65})`;
            ctx.lineWidth = 1;
            ctx.stroke();
        } else if (mode === "snow") {
            ctx.arc(p.x, p.y, p.size * 1.5, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(220, 250, 255, ${p.opacity * alpha})`;
            ctx.fill();
        } else if (mode === "fog") {
            ctx.arc(p.x, p.y, 80, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(180, 210, 220, ${0.008 * alpha})`;
            ctx.fill();
        }
    }
}

function smoothStep(t) {
    return t * t * (3 - 2 * t);
}

function drawWeather() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    if (!transitionActive) {
        updateParticles(particles, currentWeatherMode);
        drawParticles(particles, currentWeatherMode, 1);
    } else {
        const progress = Math.min(Math.max((performance.now() - transitionStart) / PARTICLE_TRANSITION_DURATION, 0), 1);
        const smooth = smoothStep(progress);
        updateParticles(particles, previousWeatherMode);
        updateParticles(nextParticles, currentWeatherMode);
        drawParticles(particles, previousWeatherMode, 1 - smooth);
        drawParticles(nextParticles, currentWeatherMode, smooth);

        if (progress >= 1) {
            particles = nextParticles;
            nextParticles = [];
            transitionActive = false;
        }
    }

    requestAnimationFrame(drawWeather);
}

function findHourIndex(times, currentHour) {
    return times.findIndex(time => time.startsWith(currentHour));
}

async function loadWeather() {
    weatherStatus.textContent = ui.weatherUpdating;

    if (place.latitude == null || place.longitude == null) {
        weatherStatus.textContent = ui.waitingLocation;
        return;
    }

    const params = new URLSearchParams({
        latitude: place.latitude,
        longitude: place.longitude,
        timezone: "auto",
        forecast_days: "2",
        current: [
            "temperature_2m", "relative_humidity_2m", "apparent_temperature", "precipitation",
            "weather_code", "wind_speed_10m", "wind_direction_10m", "is_day"
        ].join(","),
        hourly: ["temperature_2m", "weather_code", "precipitation_probability"].join(","),
        daily: ["sunrise", "sunset", "temperature_2m_max", "temperature_2m_min"].join(",")
    });

    try {
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`Weather HTTP ${response.status}`);
        weatherData = await response.json();
        if (weatherData.timezone) setTimezone(weatherData.timezone);
        if (typeof weatherData.utc_offset_seconds === "number") place.utcOffsetSeconds = weatherData.utc_offset_seconds;
        updatePlaceLabels();
        renderWeather(weatherData);
        weatherStatus.textContent = ui.weatherOnline;
        weatherUpdated.textContent = `${ui.updated} ${new Date().toLocaleTimeString(ui.htmlLang, {
            timeZone: place.timezone,
            hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"
        })}`;
    } catch (error) {
        console.error("Weather error:", error);
        weatherStatus.textContent = weatherData ? ui.weatherHoldover : ui.weatherUnavailable;
    }
}

function renderWeather(data) {
    const current = data.current;
    const info = weatherInfo(current.weather_code, Boolean(current.is_day));
    const currentHour = current.time.substring(0, 13);
    const hourIndex = findHourIndex(data.hourly.time, currentHour);
    const rainProbability = hourIndex >= 0 ? data.hourly.precipitation_probability[hourIndex] : null;

    weatherIcon.textContent = info.icon;
    temperature.textContent = `${Math.round(current.temperature_2m)}°`;
    condition.textContent = info.text;
    feelsLike.textContent = `${Math.round(current.apparent_temperature)}°`;
    humidity.textContent = `${Math.round(current.relative_humidity_2m)}%`;
    wind.textContent = `${Math.round(current.wind_speed_10m)} km/h`;
    precipitation.textContent = rainProbability !== null ? `${Math.round(rainProbability)}%` : "--%";

    renderForecast(data, currentHour, hourIndex);
    setWeatherMode(getWeatherMode(current.weather_code));
}

function renderForecast(data, currentHour, startIndex) {
    forecast.innerHTML = "";
    const times = data.hourly.time;
    const start = startIndex >= 0 ? startIndex : findHourIndex(times, currentHour);
    const from = start >= 0 ? start : 0;
    const until = Math.min(from + 8, times.length);

    for (let i = from; i < until; i++) {
        const date = new Date(withLocalOffset(times[i]));
        const hour = date.toLocaleTimeString(ui.htmlLang, {
            hour: "2-digit", minute: "2-digit", hour12: false, timeZone: place.timezone
        });
        const info = weatherInfo(data.hourly.weather_code[i], true);
        const item = document.createElement("div");
        item.className = "forecast-item";
        item.innerHTML = `
            <div class="forecast-time">${hour}</div>
            <div class="forecast-icon">${info.icon}</div>
            <div class="forecast-temp">${Math.round(data.hourly.temperature_2m[i])}°</div>
        `;
        forecast.appendChild(item);
    }
}

window.addEventListener("online", async () => {
    if (place.latitude == null) {
        try { await resolveLocation(); }
        catch (error) { console.warn("Location retry failed:", error); }
    }
    synchronizeClock();
    loadWeather();
});

window.addEventListener("offline", () => {
    setSyncUI(
        "status-dot offline",
        calibrated ? ui.offlineHoldover : ui.localClock,
        calibrated ? ui.lastCalibration : ui.localClock
    );
    weatherStatus.textContent = weatherData ? ui.weatherHoldover : ui.weatherOffline;
});

window.addEventListener("resize", resizeCanvas);
window.addEventListener("mousemove", event => {
    if (cursorLight) {
        cursorLight.style.left = `${event.clientX}px`;
        cursorLight.style.top = `${event.clientY}px`;
    }
});

resizeCanvas();
particles = createParticles(currentWeatherMode);
drawWeather();
setTimezone(place.timezone);
setInterfaceLocale(selectedLocale);
updateClock();
setInterval(updateClock, 100);

(async function start() {
    try {
        await resolveLocation();
    } catch (error) {
        console.warn("Location unavailable:", error);
        weatherStatus.textContent = ui.locationUnavailable;
        updatePlaceLabels();
    }
    synchronizeClock();
    loadWeather();
    setInterval(synchronizeClock, RESYNC_INTERVAL);
    setInterval(loadWeather, WEATHER_INTERVAL);
})();
</script>
